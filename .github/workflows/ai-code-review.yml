name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-code-review:
    if: ${{ github.event.pull_request.draft == false }}

    permissions:
      contents: read
      issues: write
      pull-requests: write

    uses: GiggleAcademy/giggle-common-actions/.github/workflows/codex-review.yml@main

    with:
      effort: high
      min_severity: medium
      rules_path: AGENTS.md
      rules_required: false

    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

