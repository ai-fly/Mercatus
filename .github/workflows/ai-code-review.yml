name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:
    uses: GiggleAcademy/giggle-common-actions/.github/workflows/codex-review.yml@main

    with:
      model: "z-ai/glm-5.2:free"
      responses_api_endpoint: "https://openrouter.ai/api/v1/responses"

      effort: high
      min_severity: medium

      rules_path: AGENTS.md
      rules_required: false

    secrets:
      openai_api_key: ${{ secrets.OPENROUTER_API_KEY }}
